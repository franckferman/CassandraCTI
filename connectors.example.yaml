connectors:
  # --- TEAMS CONNECTORS ---
  # Channel: CERT Alerts
  - id: cassandra-cert
    type: teams
    params:
      webhook_url: ${MSTEAMS_WEBHOOK_CERT}
      theme_color: "0078D7" # Blue
      throttle_ms: 400
      emojis: true
      emoji_map:
        "rss:FR-CERT Alertes": "🇫🇷"
        "rss:FR-CERT Avis": "🇫🇷"
        "rss:US-CERT CISA": "🇺🇸"

  # Channel: Vendor & Microsoft
  - id: cassandra-vendor
    type: teams
    params:
      webhook_url: ${MSTEAMS_WEBHOOK_VENDOR}
      theme_color: "8E44AD" # Purple
      throttle_ms: 400
      emojis: true

  # Channel: News & Tech
  - id: cassandra-news
    type: teams
    params:
      webhook_url: ${MSTEAMS_WEBHOOK_NEWS}
      theme_color: "D83B01" # Orange
      throttle_ms: 400
      emojis: true
      batching: { enabled: true, max_items: 5, max_interval_seconds: 60 }

  # Channel: Ransomware
  - id: cassandra-ransomware
    type: teams
    params:
      webhook_url: ${MSTEAMS_WEBHOOK_RANSOMWARE}
      theme_color: "107C10" # Green
      throttle_ms: 500
      emojis: true

  # Channel: Malicious Domains
  - id: cassandra-domains
    type: teams
    params:
      webhook_url: ${MSTEAMS_WEBHOOK_DOMAINS}
      theme_color: "C0392B" # Red
      throttle_ms: 500
      emojis: true

  # --- DISCORD CONNECTORS ---
  - id: discord-alert
    type: discord
    params:
      webhook_url: ${DISCORD_WEBHOOK_URL}
      username: "CTI Bot"
      avatar_url: "https://cdn-icons-png.flaticon.com/512/2092/2092663.png"

  # --- TELEGRAM CONNECTORS ---
  # Bot token from @BotFather; add the bot as ADMIN of the target channel.
  # chat_id: "@publicchannel" or a numeric id (e.g. -100123456789) for private.
  - id: telegram-soc
    type: telegram
    params:
      bot_token: ${TELEGRAM_BOT_TOKEN}
      chat_id: ${TELEGRAM_CHAT_ID}
      throttle_ms: 1000
      emojis: true
      # parse_mode: HTML            # default; falls back to plain text on parse errors
      # disable_web_page_preview: true

  # --- SMTP (EMAIL) CONNECTORS ---
  # security: starttls (587, default) | ssl (465) | none (25, internal relay)
  - id: email-soc
    type: smtp
    params:
      host: ${SMTP_HOST}                 # e.g. smtp.gmail.com
      port: 587
      security: starttls
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}         # app password / API key
      from_addr: ${SMTP_FROM}            # defaults to username if omitted
      to_addrs: ${SMTP_TO}               # "a@x.com,b@y.com" or a YAML list
      subject_prefix: "[CTI]"
      throttle_ms: 1000
      # batching: { enabled: true, max_items: 20 }   # digest emails

  # --- WEB DASHBOARD CONNECTOR ---
  # Live read-only dashboard (http://host:port) — events show up in real time.
  # Bind to localhost unless you also set a token. See README → Web Dashboard.
  - id: web-soc
    type: web
    params:
      host: 127.0.0.1
      port: 8080
      # token: ${CTI_WEB_TOKEN}   # optional Bearer / ?token= authentication

  # --- SIGNAL CONNECTOR ---
  # Signal has no hosted API — run a self-hosted bridge (bbernhard/signal-cli-rest-api)
  # and register a dedicated number once. recipients can mix numbers AND group ids.
  #   docker run -d -p 8090:8080 -v signal-cli:/home/.local/share/signal-cli bbernhard/signal-cli-rest-api
  - id: signal-soc
    type: signal
    params:
      api_url: "http://localhost:8090"      # your signal-cli-rest-api endpoint
      number: ${SIGNAL_NUMBER}              # the registered sender, e.g. +33600000000
      # recipients is a plain list — number only / group only / both:
      #   ["+33611111111"]  |  ["group.AbCdEf123="]  |  ["+33611111111", "group.AbCdEf123="]
      recipients: ["+33611111111", "group.AbCdEf123="]
      throttle_ms: 500
      # text_mode: styled                   # optional: basic *bold* / _italic_ formatting
