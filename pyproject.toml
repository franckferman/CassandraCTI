[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CassandraCTI"
version = "2.0.0"
description = "Modular Cyber Threat Intelligence Aggregator"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "feedparser>=6.0",
  "PyYAML>=6.0",
  "ruamel.yaml>=0.18",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "tenacity>=8.4",
  "prometheus-client>=0.20",
  "url-normalize>=1.4",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "typer>=0.12",
  "colorama>=0.4",
  "aiohttp-cors>=0.7.0",
  "dnspython>=2.4.0",
  "Pillow>=10.0.0",
  "psutil>=5.9.0"
]

[project.scripts]
cassandra = "cassandra_cti.cli:app"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cassandra_cti*"]


